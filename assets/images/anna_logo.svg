<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Anna — geometric A</title>
  <desc>A flat-topped capital A with a triangular counter and a straight crossbar, cut from one shape.</desc>

