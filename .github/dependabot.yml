version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Resolving every crate in a workspace this size, and a grouped update across all of them, ran
    # past Dependabot's time limit. Direct dependencies only, one pull request each, keeps a run
    # short; security updates for any dependency still arrive as soon as an advisory is published.
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
