name: Report a bug
description: Report a problem with Anna.
type: Bug
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Is this bug already reported? Upvote to get it noticed faster. [Here’s the search](https://github.com/Workspaacing/anna/issues). Upvote means giving it a :+1: reaction.

        Feature request, or just have a question? Please open a [discussion](https://github.com/Workspaacing/anna/discussions/new/choose) instead.
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean Anna install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Anna
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Anna version and system specs
      description: |
        Open the command palette in Anna, then type “anna: copy system specs into clipboard”.
      placeholder: |
        Anna: v1.0.0 (stable 71758a3f0c2d4e6b8a9c1d3e5f7a9b0c2d4e6f8a)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Anna log file
      description: |
        Open the command palette in Anna, then type `anna: open log` to see the last 1000 lines. Or type `anna: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Anna.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Anna settings
      description: |
        Open the command palette in Anna, then type “anna: open settings file” and copy/paste any relevant (e.g., LSP-specific) settings.

        ⚠️ **Please review your settings file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>settings.json</summary>

        <!-- Paste your settings inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Keymap
      description: |
        Open the command palette in Anna, then type “anna: open keymap file” and copy/paste the file’s contents.
      value: |
        <details><summary>keymap.json</summary>

        <!-- Paste your keymap file inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: (for AI issues) Model provider details
      placeholder: |
        - Provider: (Anthropic, OpenAI, Google, Mistral, etc.)
        - Model Name: (Claude Sonnet 4.5, Gemini 3.1 Pro, GPT-5)
        - Other details (the tool the agent was using, relevant `cowork` settings, etc.):
    validations:
      required: false
  - type: dropdown
    attributes:
      label: If you are using WSL on Windows, what flavor of Linux are you using?
      multiple: false
      options:
        - Arch Linux
        - Ubuntu
        - Fedora
        - Mint
        - Pop!_OS
        - NixOS
        - Other
