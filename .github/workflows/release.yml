name: release
run-name: "${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || github.event_name == 'workflow_dispatch' && format('Test build of {0} ({1})', github.ref_name, inputs.platforms) || 'Warm the release build cache' }}"
on:
  push:
    tags:
      - v*
    # Pushes to main only build, to refresh the cache the next release restores. GitHub
    # evaluates path filters for branch pushes but not for tag pushes.
    branches:
      - main
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - .cargo/config.toml
      - .github/workflows/release.yml
  schedule:
    # GitHub evicts caches that go unused for 7 days.
    - cron: '0 6 * * 1'
  # A manual run builds the chosen platforms from the chosen branch and uploads the installers
  # to the run's page, to download and try a change without building it locally. It never
  # publishes a release.
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: windows
        options:
          - windows
          - macos
          - linux
          - all
permissions:
  contents: write
concurrency:
  # By event too, so a test build on main and a cache-warming push to main do not cancel each other.
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  check_version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/wu/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/wu/Cargo.toml version ${version}"
            exit 1
          fi

  bundle_mac:
    needs: check_version
    if: ${{ !cancelled() && needs.check_version.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'macos' || inputs.platforms == 'all') }}
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      # A tag restores the caches saved on main, but a cache saved by a tag is only visible
      # to that tag, so only main saves and tags do not crowd main's caches out of the quota.
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-aarch64
          add-job-id-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      # Signing and notarization only happen when these secrets exist.
      # Without them the bundle is ad-hoc signed.
      - name: Prepare provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
            echo "MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac aarch64-apple-darwin
      # A tag hands these to the release job. A manual test build keeps them for a week, and 0
      # leaves a tag's at the repository's default.
      - if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 0 }}
          path: |
            target/aarch64-apple-darwin/release/Anna-aarch64.dmg
            target/anna-remote-server-macos-aarch64.gz
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64-dsym
          path: target/aarch64-apple-darwin/release/Anna.dSYM.zip
          if-no-files-found: error

  bundle_linux:
    needs: check_version
    if: ${{ !cancelled() && needs.check_version.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'linux' || inputs.platforms == 'all') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      # No Rust build cache: the free 10 GB of Actions cache holds the macOS and Windows release
      # caches and the ci workflow's, which run on every pull request. A Linux cache saved the
      # least time per gigabyte, 34 to 29 minutes, since the workspace's own crates rebuild anyway.
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      - name: Bundle
        run: ./script/bundle-linux
      - if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 0 }}
          path: |
            target/release/anna-linux-${{ matrix.arch }}.tar.gz
            target/anna-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  bundle_windows:
    needs: check_version
    if: ${{ !cancelled() && needs.check_version.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'windows' || inputs.platforms == 'all') }}
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64
          add-job-id-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use the stable release channel
        run: Set-Content -Path crates/wu/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Bundle
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 0 }}
          path: |
            target/Anna-x86_64.exe
            target/anna-remote-server-windows-x86_64.gz
          if-no-files-found: error

  release:
    needs: [bundle_mac, bundle_linux, bundle_windows]
    # Only a pushed tag publishes, even when a manual run is started on a tag.
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep debug symbols out of the release assets
        run: find artifacts -name '*.dSYM.zip' -delete
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release/body.md
          generate_release_notes: true
          files: artifacts/**
