name: codeql
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - docs/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - docs/**
  schedule:
    - cron: '30 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
          - rust
    steps:
      - uses: actions/checkout@v7
      # Code scanning's default setup does not offer Rust, so this workflow replaces it.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Analyzed from source without a build: building Anna takes hours, and CodeQL reads
          # Rust, JavaScript, Python and workflow files without one.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
